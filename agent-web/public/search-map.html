<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search</title>
<link rel="stylesheet" href="haven/colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; height:100%; background:#FFFFFF; font-family:var(--font-body, 'Mulish', sans-serif); color:#1A1816; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  a { color:#1A1816; } a:hover { color:#D92228; }
  .topbar { display:flex; align-items:center; gap:16px; padding:12px 16px 10px; flex:none; }
  /*
   * The action bar: the overflow menu, "Save search", and Ask, spacing-300 (8px) apart. A
   * group of its own rather than topbar children, so the 16px between the topbar's separate
   * regions (MLS, search field, action bar) doesn't also open up the items inside this one.
   */
  .actionbar { display:flex; align-items:center; gap:8px; flex:none; }
  .mls { display:flex; align-items:center; gap:10px; border:1px solid #D3CFCA; border-radius:40px; padding:6px 16px; cursor:pointer; background:#FFFFFF; }
  .mls:hover { box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .mls .lab { font-size:11px; font-weight:700; line-height:13px; }
  .mls .val { font-size:13px; font-weight:800; line-height:16px; white-space:nowrap; }
  .searchbox { flex:none; width:420px; display:flex; align-items:center; gap:10px; border:1px solid #D3CFCA; border-radius:40px; padding:0 18px; height:44px; background:#FFFFFF; }
  .searchbox input { border:none; outline:none; flex:1; font-size:14px; font-family:inherit; color:#1A1816; background:transparent; }
  .searchbox input::placeholder { color:#958A7F; }
  .iconbtn { width:36px; height:36px; flex:none; border-radius:50%; border:1px solid #D3CFCA; background:#FFFFFF; color:#1A1816; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:box-shadow 120ms; }
  .iconbtn:hover { box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  /* Open: inverted, matching src/components/Menu.tsx's MenuToggle. */
  .iconbtn[aria-expanded="true"] { border-color:#1A1816; background:#1A1816; color:#FFFFFF; }

  /*
   * Overflow menu, mirroring the panel in src/components/Menu.tsx — a ⋯ button opens a menu
   * everywhere in this shell, and a public/ page cannot import that component.
   */
  .menuwrap { position:relative; display:inline-flex; flex:none; }
  /* z-index clears Leaflet's own control containers (1000), which the panel drops over. */
  .menupanel { position:absolute; top:calc(100% + 8px); right:0; min-width:180px; background:#FFFFFF; border:1px solid #E9E7E4; border-radius:16px; box-shadow:0 1px 2px rgba(26,24,22,0.08), 0 8px 24px rgba(26,24,22,0.16); padding:6px; z-index:1100; display:none; flex-direction:column; gap:2px; }
  .menuwrap.open .menupanel { display:flex; }
  .menuitem { display:flex; align-items:center; height:38px; padding:0 12px; border:none; border-radius:10px; background:transparent; color:#1A1816; font-family:inherit; font-size:14px; font-weight:500; text-align:left; white-space:nowrap; cursor:pointer; transition:background 120ms; }
  .menuitem:hover { background:#F2F0EF; }
  /* 36px/13px: it is an action bar item, and the bar's items share one geometry. */
  .savebtn { border:none; background:#1A1816; color:#FFFFFF; font-family:inherit; font-size:13px; font-weight:700; line-height:1; border-radius:40px; height:36px; padding:0 16px; cursor:pointer; transition:box-shadow 120ms; }
  .savebtn:hover { box-shadow:0 4px 12px rgba(26,24,22,0.3); }

  /*
   * Action bar (variant B of the FAB-placement test). Hidden unless the shell frames this
   * page with `?ab=b`; the same `Ask` control otherwise floats over the map as the FAB.
   *
   * The label drops below 1200px. That is high for a 190px pill, but the row ahead of it is
   * inflexible: the MLS button, a fixed 420px search field, `•••`, and "Save search" come to
   * roughly 800px before the spacer, and this iframe is narrower than the window whenever
   * the assistant panel is docked open.
   *
   * Geometry (36px tall, 16px sides, 13px label, 16px icon) is shared with the same control
   * in `tours-map.html` and in `src/components/ActionBar.tsx`. Those are three separate
   * documents — a public/ page cannot import the app's modules — so the numbers are
   * duplicated and have to be changed together.
   */
  .askbtn { display:none; align-items:center; gap:8px; flex:none; height:36px; border:none; border-radius:40px; padding:0 16px; background:linear-gradient(95deg, rgb(240,67,73) 0%, rgb(217,34,40) 62%, rgb(194,41,138) 150%); color:#FFFFFF; font-family:inherit; font-size:13px; font-weight:700; line-height:1; white-space:nowrap; cursor:pointer; transition:box-shadow 120ms, transform 120ms cubic-bezier(0.2,0.8,0.2,1); }
  /* `ask-open` is set from the shell while the assistant panel is on screen. */
  body.ab-b:not(.ask-open) .askbtn { display:flex; }
  .askbtn:hover { box-shadow:0 4px 12px rgba(217,34,40,0.36); transform:translateY(-1px); }
  @media (max-width:1200px) {
    .askbtn { width:36px; padding:0; justify-content:center; }
    .askbtn .lbl { display:none; }
  }
  /* The 420px search field is itself the problem below this — let it give up its floor. */
  @media (max-width:1080px) {
    body.ab-b .searchbox { flex:1 1 auto; width:auto; min-width:0; }
  }
  .chiprow { display:flex; align-items:center; gap:8px; padding:0 16px 12px; flex:none; }
  .chips { display:flex; align-items:center; gap:8px; flex:1; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { display:flex; align-items:center; gap:6px; border:1px solid #D3CFCA; border-radius:8px; background:#FFFFFF; color:#1A1816; font-family:inherit; font-size:14px; font-weight:600; padding:7px 14px; white-space:nowrap; cursor:pointer; transition:box-shadow 120ms; }
  .chip:hover { box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .chip.hot { border-color:#D92228; color:#D92228; }
  .views { display:inline-flex; background:var(--gray-100,#F2F0EF); border-radius:9999px; padding:4px; flex:none; }
  .viewbtn { width:44px; height:32px; border-radius:9999px; border:none; background:transparent; color:#1A1816; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:background 120ms, box-shadow 120ms; }
  .viewbtn.active { background:#FFFFFF; box-shadow:var(--shadow-raised, 0 1px 3px rgba(26,24,22,0.16)); }
  .viewbtn:not(.active):hover { background:rgba(0,0,0,0.04); }
  #map { flex:1; min-height:0; }
  .leaflet-tile-pane { filter:saturate(0.45) brightness(1.05) contrast(0.92); }
  .price-pin { background:transparent; border:none; }
  .price-pin .pill { position:relative; display:inline-flex; align-items:center; justify-content:center; background:#D92228; color:#FFFFFF; font-family:var(--font-body, 'Mulish', sans-serif); font-weight:800; font-size:12px; line-height:1; padding:5px 9px; border-radius:10px; box-shadow:0 1px 4px rgba(26,24,22,0.35); transform:translate(-50%,-100%); white-space:nowrap; }
  .price-pin .pill::after { content:""; position:absolute; left:50%; bottom:-4px; width:8px; height:8px; background:#D92228; transform:translateX(-50%) rotate(45deg); border-radius:1px; }
  .price-pin .pill:hover { background:#B71C21; }
  .price-pin .pill:hover::after { background:#B71C21; }
  .overlay { position:absolute; z-index:800; }
  .drawbtn { top:16px; left:16px; width:48px; height:48px; border-radius:50%; border:1px solid #D3CFCA; background:#FFFFFF; color:#1A1816; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:10px; font-weight:700; font-family:inherit; cursor:pointer; box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .drawbtn:hover { box-shadow:0 2px 8px rgba(26,24,22,0.24); }
  .listings { left:16px; bottom:24px; background:#FFFFFF; border:1px solid #E9E7E4; border-radius:12px; box-shadow:0 2px 8px rgba(26,24,22,0.16); padding:8px 14px 8px 10px; display:flex; align-items:center; gap:8px; cursor:pointer; }
  .listings .t1 { font-size:13px; font-weight:800; line-height:16px; }
  .listings .t2 { font-size:11px; font-weight:600; line-height:13px; color:#726A60; }
  .layersbtn { right:16px; bottom:24px; height:40px; border-radius:8px; border:1px solid #D3CFCA; background:#FFFFFF; color:#1A1816; font-family:inherit; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; padding:0 14px; cursor:pointer; box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .layersbtn:hover { box-shadow:0 2px 8px rgba(26,24,22,0.24); }
  .leaflet-control-zoom { border:none !important; box-shadow:none !important; display:flex; flex-direction:column; gap:8px; margin-right:16px !important; margin-bottom:80px !important; }
  .leaflet-control-zoom a { width:36px !important; height:36px !important; line-height:34px !important; border-radius:50% !important; border:1px solid #D3CFCA !important; background:#FFFFFF !important; color:#1A1816 !important; font-weight:600; box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .leaflet-popup-content-wrapper { border-radius:12px; box-shadow:0 2px 16px rgba(26,24,22,0.2); }
  .leaflet-popup-content { margin:12px 16px; font-family:var(--font-body, 'Mulish', sans-serif); }
  .pop .price { font-size:16px; font-weight:800; }
  .pop .meta { font-size:12px; color:#726A60; margin-top:2px; }

  /*
   * Narrow viewports (the shell's own mobile breakpoint, since this page is only ever
   * framed by it). The search field gives up its fixed 420px and takes the first row on
   * its own; everything else wraps beneath.
   */
  @media (max-width:768px) {
    /* `.actionbar` keeps its own 8px whatever the topbar's regions do. */
    .topbar { flex-wrap:wrap; gap:8px; padding:10px 12px 8px; }
    .searchbox { flex:1 1 100%; width:auto; min-width:0; order:-1; height:40px; padding:0 14px; }
    .mls { flex:1 1 auto; min-width:0; padding:6px 12px; gap:8px; }
    .mls .val { font-size:12.5px; white-space:normal; }
    /* `.savebtn` is already 36px/13px/16px here — the action bar's shared geometry. */
    .chiprow { padding:0 12px 10px; }
    .viewbtn { width:36px; }
    .listings { left:12px; bottom:16px; }
    .layersbtn { right:12px; bottom:16px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <button class="mls">
      <span><span class="lab">Searching</span><br><span class="val">All Available MLSs</span></span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div class="searchbox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#726A60" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="text" placeholder="City, neighborhood, address, school...">
    </div>
    <div style="flex:1;"></div>
    <div class="actionbar">
      <!-- Far left of the action bar, and a real overflow menu — see the .menupanel rules. -->
      <div class="menuwrap" id="moreWrap">
        <button class="iconbtn" id="moreBtn" aria-label="More" aria-haspopup="menu" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
        </button>
        <div class="menupanel" role="menu">
          <button class="menuitem" role="menuitem">Save this search</button>
          <button class="menuitem" role="menuitem">Email results to client</button>
          <button class="menuitem" role="menuitem">Export results</button>
          <button class="menuitem" role="menuitem">Search settings</button>
        </div>
      </div>
      <button class="savebtn">Save search</button>
      <button class="askbtn" id="askBtn" aria-label="Ask RealAssist+ AI" title="Ask RealAssist+ AI">
        <!-- The RealAssist+ mark from src/icons.tsx (IconRealAssist), duplicated because a
             public/ page cannot import the app's modules. 20 units of artwork inset 2 units
             in a 24-unit box, so the glyph scales with the box instead of being clipped. -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:block;flex:none;"><g transform="translate(2, 2)"><path d="M 10.351 0 C 10.351 5.327 14.673 9.649 20 9.649 L 20 10.351 C 14.673 10.351 10.351 14.673 10.351 20 L 9.649 20 C 9.649 14.673 5.327 10.351 0 10.351 L 0 9.649 C 5.327 9.649 9.649 5.327 9.649 0 L 10.351 0 Z" fill-rule="evenodd"></path><path d="M 17.024 13.27 C 17.024 14.864 18.315 16.165 19.92 16.165 L 19.92 16.375 C 18.326 16.375 17.025 17.665 17.024 19.27 L 16.815 19.27 C 16.815 17.675 15.525 16.375 13.92 16.375 L 13.92 16.165 C 15.514 16.165 16.815 14.874 16.815 13.27 L 17.024 13.27 Z" fill-rule="evenodd"></path><path d="M 16.92 2.899 C 17.472 2.899 17.92 3.347 17.92 3.899 C 17.92 4.452 17.472 4.899 16.92 4.899 C 16.368 4.899 15.92 4.452 15.92 3.899 C 15.92 3.347 16.368 2.899 16.92 2.899 Z" fill-rule="evenodd"></path></g></svg>
        <span class="lbl">Ask RealAssist&trade;+ AI</span>
      </button>
    </div>
  </div>
  <div class="chiprow">
    <div class="chips">
      <button class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"></path><circle cx="16" cy="6" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="18" r="2"></circle></svg>Filters</button>
      <button class="chip hot"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M12.2857 4.7543C12.228 4.70992 12.14 4.76183 12.1583 4.82843C12.8791 7.44537 11.0589 9.51841 10.2275 9.15029C9.7775 8.95029 9.83 8.29316 9.83 8.29316C10.0088 6.89557 9.89674 5.47804 9.5 4.12177C9.19185 3.21681 8.6443 2.40264 7.91 1.75751C7.6366 1.47955 7.32393 1.24063 6.9818 1.04723C6.73911 0.910043 6.4465 1.0903 6.42459 1.34907C6.35752 2.14112 6.05535 2.903 5.5475 3.5432C5.21222 4.03125 4.83863 4.49448 4.43 4.9289C3.35 6.09318 2 7.54316 2 9.67886C2 12.1051 4.05998 14.3744 6.61621 14.9975C6.69644 15.0171 6.75004 14.9157 6.69047 14.8632C6.30232 14.5207 6.04303 14.0616 5.96 13.5574C5.96 13.5574 5.52018 11.9157 7.11043 9.5587C7.15059 9.49918 7.26889 9.52335 7.28498 9.5916C7.38084 9.99813 7.73932 10.8745 9.08 11.7431C9.68369 12.1023 10.0493 12.7335 10.0462 13.4114C10.0437 13.9669 9.79399 14.4889 9.37 14.8543C9.30876 14.907 9.36271 15.0155 9.44451 14.9965C12.049 14.3926 14 12.0984 14 9.67886C14 8.36032 13.5714 7.13523 13.5714 7.13523C13.5714 7.13523 13.034 5.3433 12.2857 4.7543Z"></path></svg>Hotsheet</button>
      <button class="chip">Price</button>
      <button class="chip">Property type</button>
      <button class="chip">Status</button>
      <button class="chip">Bedrooms</button>
      <button class="chip">Bathrooms</button>
      <button class="chip"># of parking spots</button>
      <button class="chip">Lot size acres</button>
      <button class="chip">Living area</button>
      <button class="chip">Association fee</button>
    </div>
    <div class="views">
      <button class="viewbtn active" aria-label="Map view"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3.6 5.2A1 1 0 0 0 3 6.1v13.4a1 1 0 0 0 1.4.9L9 18.5l6 2.5 5.4-2.2a1 1 0 0 0 .6-.9V4.5a1 1 0 0 0-1.4-.9L15 5.5 9 3Z"></path><path d="M9 3v15.5M15 5.5V21"></path></svg></button>
      <button class="viewbtn" aria-label="Grid view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></button>
      <button class="viewbtn" aria-label="Split view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M12 3v18"></path></svg></button>
    </div>
  </div>
  <div id="map">
    <button class="overlay drawbtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>Draw</button>
    <button class="overlay listings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D92228" stroke-width="2" stroke-linecap="round"><path d="M5 21V10M12 21V4M19 21v-8"></path></svg>
      <span><span class="t1" id="listingCount"></span><br><span class="t2">View stats</span></span>
    </button>
    <button class="overlay layersbtn">Layers
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5Z"></path><path d="m3 12 9 5 9-5"></path><path d="m3 17 9 5 9-5"></path></svg>
    </button>
  </div>
<script>
  const map = L.map('map', { zoomControl: false });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Mirrors all ten listings in src/data/sample/sample-data.json. This file is served
  // from public/, so it cannot import the dataset; if the sample data changes, these
  // rows have to be updated by hand.
  //
  // The dataset's cities are fictional and carry no coordinates. The lat/lngs below are
  // arbitrary map positions, spread only so the pins don't overlap.
  const LISTINGS = [
    { price: '615k',  full: '$615,000',   meta: '2 bd · 1 ba · 1,015 sqft',    addr: '142 Larkspur Ave',  city: 'Rivertown, ST',     status: 'New',          ll: [37.8422, -122.1948] },
    { price: '1.13m', full: '$1,130,000', meta: '4 bd · 2 ba · 1,675 sqft',    addr: '58 Blackwood Lane', city: 'Maple Heights, ST', status: 'New',          ll: [37.8398, -122.1832] },
    { price: '450k',  full: '$450,000',   meta: '1 bd · 1 ba · 603 sqft',      addr: '410 3rd St # 202',  city: 'Old Quarter, ST',   status: 'Active',       ll: [37.8351, -122.1902] },
    { price: '615k',  full: '$615,000',   meta: '4 bd · 2.5 ba · 1,835 sqft',  addr: '3975 Turnley Ct',   city: 'Cedar Vale, ST',    status: 'New',          ll: [37.8318, -122.1791] },
    { price: '630k',  full: '$630,000',   meta: '1 bd · 1.5 ba · 1,068 sqft',  addr: '4902 Bayview # 203', city: 'Harborline, ST',   status: 'Active',       ll: [37.8288, -122.1968] },
    { price: '750k',  full: '$749,888',   meta: '3 bd · 2 ba · 1,911 sqft',    addr: '1678 Wallace Ave',  city: 'Old Quarter, ST',   status: 'Price Change', ll: [37.8261, -122.1861] },
    { price: '1.13m', full: '$1,125,000', meta: '3 bd · 2 ba · 2,008 sqft',    addr: '195 Stanton Way',   city: 'Summit Grove, ST',  status: 'Price Change', ll: [37.8238, -122.1772] },
    { price: '1.9m',  full: '$1,899,000', meta: '4 bd · 2.5 ba · 2,073 sqft',  addr: '34 Salinas Pl',     city: 'Willowmere, ST',    status: 'Coming Soon',  ll: [37.8202, -122.1931] },
    { price: '540k',  full: '$540,000',   meta: '2 bd · 0 ba',                 addr: '1442 92nd Court',   city: 'Rivertown, ST',     status: 'Price Change', ll: [37.8188, -122.1848] },
    { price: '1m',    full: '$1,000,000', meta: '4 bd · 2 ba · 1,776 sqft',    addr: '155 Sunset Blvd',   city: 'Maple Heights, ST', status: 'Closed',       ll: [37.8165, -122.1758] }
  ];
  LISTINGS.forEach(l => {
    const icon = L.divIcon({ className: 'price-pin', html: '<span class="pill">' + l.price + '</span>', iconSize: [0, 0] });
    L.marker(l.ll, { icon }).addTo(map)
      .bindPopup('<div class="pop"><div class="price">' + l.full + '</div><div class="meta">' + l.meta + '</div><div class="meta">' + l.addr + ', ' + l.city + '</div><div class="meta">' + l.status + '</div></div>');
  });
  map.fitBounds(L.latLngBounds(LISTINGS.map(l => l.ll)).pad(0.25));
  document.getElementById('listingCount').textContent =
    LISTINGS.length + (LISTINGS.length === 1 ? ' Listing' : ' Listings');

  // Overflow menu. Click-outside and Escape close it, matching src/components/Menu.tsx.
  const moreWrap = document.getElementById('moreWrap');
  const moreBtn = document.getElementById('moreBtn');
  function setMenu(open) {
    moreWrap.classList.toggle('open', open);
    moreBtn.setAttribute('aria-expanded', String(open));
  }
  moreBtn.addEventListener('click', e => {
    e.stopPropagation();
    setMenu(!moreWrap.classList.contains('open'));
  });
  moreWrap.querySelectorAll('.menuitem').forEach(it => it.addEventListener('click', () => setMenu(false)));
  document.addEventListener('mousedown', e => {
    if (!moreWrap.contains(e.target)) setMenu(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') setMenu(false);
  });

  // ── Action bar, variant B of the FAB-placement test ─────────────────────────────
  //
  // The shell appends `?ab=b` to this iframe's src, so the page knows which arm it is in
  // without needing to be told after load. Opening the assistant is the shell's job — the
  // panel lives out there, not in this document — so the click is forwarded up, and the
  // panel's open state comes back down so the button can hide while it is showing.
  if (new URLSearchParams(location.search).get('ab') === 'b') {
    document.body.classList.add('ab-b');
    document.getElementById('askBtn').addEventListener('click', () => {
      // Same-origin frame, so '*' is not a disclosure here; the shell checks the payload.
      parent.postMessage({ type: 'ra:ask' }, '*');
    });
    window.addEventListener('message', e => {
      if (e.origin !== location.origin) return;
      if (e.data && e.data.type === 'ra:ask-visible') {
        document.body.classList.toggle('ask-open', !e.data.visible);
      }
    });
  }
</script>
</body>
</html>
