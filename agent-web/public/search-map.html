<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search</title>
<link rel="stylesheet" href="haven/colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; height:100%; background:#FFFFFF; font-family:var(--font-body, 'Mulish', sans-serif); color:#1A1816; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  a { color:#1A1816; } a:hover { color:#D92228; }
  .topbar { display:flex; align-items:center; gap:16px; padding:12px 16px 10px; flex:none; }
  .mls { display:flex; align-items:center; gap:10px; border:1px solid #D3CFCA; border-radius:40px; padding:6px 16px; cursor:pointer; background:#FFFFFF; }
  .mls:hover { box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .mls .lab { font-size:11px; font-weight:700; line-height:13px; }
  .mls .val { font-size:13px; font-weight:800; line-height:16px; white-space:nowrap; }
  .searchbox { flex:none; width:420px; display:flex; align-items:center; gap:10px; border:1px solid #D3CFCA; border-radius:40px; padding:0 18px; height:44px; background:#FFFFFF; }
  .searchbox input { border:none; outline:none; flex:1; font-size:14px; font-family:inherit; color:#1A1816; background:transparent; }
  .searchbox input::placeholder { color:#958A7F; }
  .iconbtn { width:36px; height:36px; border-radius:50%; border:1px solid #D3CFCA; background:#FFFFFF; color:#1A1816; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:box-shadow 120ms; }
  .iconbtn:hover { box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .savebtn { border:none; background:#1A1816; color:#FFFFFF; font-family:inherit; font-size:14px; font-weight:700; border-radius:40px; height:40px; padding:0 20px; cursor:pointer; transition:box-shadow 120ms; }
  .savebtn:hover { box-shadow:0 4px 12px rgba(26,24,22,0.3); }
  .chiprow { display:flex; align-items:center; gap:8px; padding:0 16px 12px; flex:none; }
  .chips { display:flex; align-items:center; gap:8px; flex:1; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { display:flex; align-items:center; gap:6px; border:1px solid #D3CFCA; border-radius:8px; background:#FFFFFF; color:#1A1816; font-family:inherit; font-size:14px; font-weight:600; padding:7px 14px; white-space:nowrap; cursor:pointer; transition:box-shadow 120ms; }
  .chip:hover { box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .chip.hot { border-color:#D92228; color:#D92228; }
  .views { display:inline-flex; background:var(--gray-100,#F2F0EF); border-radius:9999px; padding:4px; flex:none; }
  .viewbtn { width:44px; height:32px; border-radius:9999px; border:none; background:transparent; color:#1A1816; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:background 120ms, box-shadow 120ms; }
  .viewbtn.active { background:#FFFFFF; box-shadow:var(--shadow-raised, 0 1px 3px rgba(26,24,22,0.16)); }
  .viewbtn:not(.active):hover { background:rgba(0,0,0,0.04); }
  #map { flex:1; min-height:0; }
  .leaflet-tile-pane { filter:saturate(0.45) brightness(1.05) contrast(0.92); }
  .price-pin { background:transparent; border:none; }
  .price-pin .pill { position:relative; display:inline-flex; align-items:center; justify-content:center; background:#D92228; color:#FFFFFF; font-family:var(--font-body, 'Mulish', sans-serif); font-weight:800; font-size:12px; line-height:1; padding:5px 9px; border-radius:10px; box-shadow:0 1px 4px rgba(26,24,22,0.35); transform:translate(-50%,-100%); white-space:nowrap; }
  .price-pin .pill::after { content:""; position:absolute; left:50%; bottom:-4px; width:8px; height:8px; background:#D92228; transform:translateX(-50%) rotate(45deg); border-radius:1px; }
  .price-pin .pill:hover { background:#B71C21; }
  .price-pin .pill:hover::after { background:#B71C21; }
  .overlay { position:absolute; z-index:800; }
  .drawbtn { top:16px; left:16px; width:48px; height:48px; border-radius:50%; border:1px solid #D3CFCA; background:#FFFFFF; color:#1A1816; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:10px; font-weight:700; font-family:inherit; cursor:pointer; box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .drawbtn:hover { box-shadow:0 2px 8px rgba(26,24,22,0.24); }
  .listings { left:16px; bottom:24px; background:#FFFFFF; border:1px solid #E9E7E4; border-radius:12px; box-shadow:0 2px 8px rgba(26,24,22,0.16); padding:8px 14px 8px 10px; display:flex; align-items:center; gap:8px; cursor:pointer; }
  .listings .t1 { font-size:13px; font-weight:800; line-height:16px; }
  .listings .t2 { font-size:11px; font-weight:600; line-height:13px; color:#726A60; }
  .layersbtn { right:16px; bottom:24px; height:40px; border-radius:8px; border:1px solid #D3CFCA; background:#FFFFFF; color:#1A1816; font-family:inherit; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; padding:0 14px; cursor:pointer; box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .layersbtn:hover { box-shadow:0 2px 8px rgba(26,24,22,0.24); }
  .leaflet-control-zoom { border:none !important; box-shadow:none !important; display:flex; flex-direction:column; gap:8px; margin-right:16px !important; margin-bottom:80px !important; }
  .leaflet-control-zoom a { width:36px !important; height:36px !important; line-height:34px !important; border-radius:50% !important; border:1px solid #D3CFCA !important; background:#FFFFFF !important; color:#1A1816 !important; font-weight:600; box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .leaflet-popup-content-wrapper { border-radius:12px; box-shadow:0 2px 16px rgba(26,24,22,0.2); }
  .leaflet-popup-content { margin:12px 16px; font-family:var(--font-body, 'Mulish', sans-serif); }
  .pop .price { font-size:16px; font-weight:800; }
  .pop .meta { font-size:12px; color:#726A60; margin-top:2px; }
</style>
</head>
<body>
  <div class="topbar">
    <button class="mls">
      <span><span class="lab">Searching</span><br><span class="val">All Available MLSs</span></span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div class="searchbox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#726A60" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="text" placeholder="City, neighborhood, address, school...">
    </div>
    <div style="flex:1;"></div>
    <button class="iconbtn" aria-label="More">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
    <button class="savebtn">Save search</button>
  </div>
  <div class="chiprow">
    <div class="chips">
      <button class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"></path><circle cx="16" cy="6" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="18" r="2"></circle></svg>Filters</button>
      <button class="chip hot"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M12.2857 4.7543C12.228 4.70992 12.14 4.76183 12.1583 4.82843C12.8791 7.44537 11.0589 9.51841 10.2275 9.15029C9.7775 8.95029 9.83 8.29316 9.83 8.29316C10.0088 6.89557 9.89674 5.47804 9.5 4.12177C9.19185 3.21681 8.6443 2.40264 7.91 1.75751C7.6366 1.47955 7.32393 1.24063 6.9818 1.04723C6.73911 0.910043 6.4465 1.0903 6.42459 1.34907C6.35752 2.14112 6.05535 2.903 5.5475 3.5432C5.21222 4.03125 4.83863 4.49448 4.43 4.9289C3.35 6.09318 2 7.54316 2 9.67886C2 12.1051 4.05998 14.3744 6.61621 14.9975C6.69644 15.0171 6.75004 14.9157 6.69047 14.8632C6.30232 14.5207 6.04303 14.0616 5.96 13.5574C5.96 13.5574 5.52018 11.9157 7.11043 9.5587C7.15059 9.49918 7.26889 9.52335 7.28498 9.5916C7.38084 9.99813 7.73932 10.8745 9.08 11.7431C9.68369 12.1023 10.0493 12.7335 10.0462 13.4114C10.0437 13.9669 9.79399 14.4889 9.37 14.8543C9.30876 14.907 9.36271 15.0155 9.44451 14.9965C12.049 14.3926 14 12.0984 14 9.67886C14 8.36032 13.5714 7.13523 13.5714 7.13523C13.5714 7.13523 13.034 5.3433 12.2857 4.7543Z"></path></svg>Hotsheet</button>
      <button class="chip">Price</button>
      <button class="chip">Property type</button>
      <button class="chip">Status</button>
      <button class="chip">Bedrooms</button>
      <button class="chip">Bathrooms</button>
      <button class="chip"># of parking spots</button>
      <button class="chip">Lot size acres</button>
      <button class="chip">Living area</button>
      <button class="chip">Association fee</button>
    </div>
    <div class="views">
      <button class="viewbtn active" aria-label="Map view"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3.6 5.2A1 1 0 0 0 3 6.1v13.4a1 1 0 0 0 1.4.9L9 18.5l6 2.5 5.4-2.2a1 1 0 0 0 .6-.9V4.5a1 1 0 0 0-1.4-.9L15 5.5 9 3Z"></path><path d="M9 3v15.5M15 5.5V21"></path></svg></button>
      <button class="viewbtn" aria-label="Grid view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></button>
      <button class="viewbtn" aria-label="Split view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M12 3v18"></path></svg></button>
    </div>
  </div>
  <div id="map">
    <button class="overlay drawbtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>Draw</button>
    <button class="overlay listings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D92228" stroke-width="2" stroke-linecap="round"><path d="M5 21V10M12 21V4M19 21v-8"></path></svg>
      <span><span class="t1">5 Listings</span><br><span class="t2">View stats</span></span>
    </button>
    <button class="overlay layersbtn">Layers
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5Z"></path><path d="m3 12 9 5 9-5"></path><path d="m3 17 9 5 9-5"></path></svg>
    </button>
  </div>
<script>
  const map = L.map('map', { zoomControl: false }).setView([37.8285, -122.187], 15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  const LISTINGS = [
    { price: '1.5m',  full: '$1,500,000', meta: '4 bd · 3 ba · 2,610 sqft', addr: '6224 Girvin Dr',      ll: [37.8422, -122.1948] },
    { price: '1.84m', full: '$1,840,000', meta: '5 bd · 4 ba · 3,180 sqft', addr: '6461 Girvin Dr',      ll: [37.8398, -122.1912] },
    { price: '1.4m',  full: '$1,400,000', meta: '4 bd · 2.5 ba · 2,340 sqft', addr: '6864 Chelton Dr',   ll: [37.8318, -122.1898] },
    { price: '995k',  full: '$995,000',   meta: '3 bd · 2 ba · 1,820 sqft', addr: '2842 Holyrood Dr',    ll: [37.8288, -122.1778] },
    { price: '990k',  full: '$990,000',   meta: '3 bd · 2 ba · 1,760 sqft', addr: '6929 Mastlands Dr',   ll: [37.8218, -122.1998] }
  ];
  LISTINGS.forEach(l => {
    const icon = L.divIcon({ className: 'price-pin', html: '<span class="pill">' + l.price + '</span>', iconSize: [0, 0] });
    L.marker(l.ll, { icon }).addTo(map)
      .bindPopup('<div class="pop"><div class="price">' + l.full + '</div><div class="meta">' + l.meta + '</div><div class="meta">' + l.addr + ', Oakland, CA</div></div>');
  });
</script>
</body>
</html>
