<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour route</title>
<link rel="stylesheet" href="haven/colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; height:100%; background:#FFFFFF; font-family:var(--font-body, 'Mulish', sans-serif); color:#1A1816; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  a { color:#1A1816; } a:hover { color:#D92228; }
  .hdr { display:flex; align-items:flex-start; gap:8px; padding:16px 24px 0; flex:none; }
  .hdr h1 { margin:0; font-family:var(--font-display); font-weight:700; font-size:22px; line-height:26px; letter-spacing:-0.02em; }
  .hdr .date { font-size:14px; font-weight:800; margin-top:14px; }
  .iconbtn { width:36px; height:36px; flex:none; border-radius:50%; border:1px solid #D3CFCA; background:#FFFFFF; color:#1A1816; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:box-shadow 120ms; }
  .iconbtn:hover { box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  /* Open: inverted, matching src/components/Menu.tsx's MenuToggle. */
  .iconbtn[aria-expanded="true"] { border-color:#1A1816; background:#1A1816; color:#FFFFFF; }

  /*
   * Overflow menu, mirroring the panel in src/components/Menu.tsx — a ⋯ button opens a menu
   * everywhere in this shell, and a public/ page cannot import that component.
   */
  .menuwrap { position:relative; display:inline-flex; flex:none; }
  /* z-index clears Leaflet's own control containers (1000), which the panel drops over. */
  .menupanel { position:absolute; top:calc(100% + 8px); right:0; min-width:180px; background:#FFFFFF; border:1px solid #E9E7E4; border-radius:16px; box-shadow:0 1px 2px rgba(26,24,22,0.08), 0 8px 24px rgba(26,24,22,0.16); padding:6px; z-index:1100; display:none; flex-direction:column; gap:2px; }
  .menuwrap.open .menupanel { display:flex; }
  .menuitem { display:flex; align-items:center; height:38px; padding:0 12px; border:none; border-radius:10px; background:transparent; color:#1A1816; font-family:inherit; font-size:14px; font-weight:500; text-align:left; white-space:nowrap; cursor:pointer; transition:background 120ms; }
  .menuitem:hover { background:#F2F0EF; }

  /*
   * The action bar: the overflow menu, then Export, Add to calendar, and Ask, spacing-300
   * (8px) apart. Its own group so the items stay 8px apart even where `.hdr` does not.
   */
  .actionbar { display:flex; align-items:center; gap:8px; flex:none; }
  .pill { display:flex; align-items:center; gap:8px; height:36px; border-radius:40px; padding:0 16px; font-family:inherit; font-size:13px; font-weight:700; line-height:1; white-space:nowrap; cursor:pointer; transition:box-shadow 120ms; }
  .pill:hover { box-shadow:0 2px 8px rgba(26,24,22,0.2); }
  .pill.light { border:1px solid #D3CFCA; background:#FFFFFF; color:#1A1816; }
  .pill.dark { border:none; background:#1A1816; color:#FFFFFF; }

  /*
   * Action bar (variant B of the FAB-placement test). Hidden unless the shell frames this
   * page with `?ab=b`; the same `Ask` control otherwise floats over the map as the FAB.
   * Labels drop below 900px, where three pills plus the tour title stop fitting on a line.
   *
   * `.pill` already gives the shared geometry (36px tall, 16px sides, 13px label, 16px
   * icon) that `search-map.html` and `src/components/ActionBar.tsx` repeat — a public/ page
   * cannot import the app's modules, so those three have to be changed together.
   */
  .pill.brand { border:none; background:linear-gradient(95deg, rgb(240,67,73) 0%, rgb(217,34,40) 62%, rgb(194,41,138) 150%); color:#FFFFFF; display:none; transition:box-shadow 120ms, transform 120ms cubic-bezier(0.2,0.8,0.2,1); }
  /* `ask-open` is set from the shell while the assistant panel is on screen. */
  body.ab-b:not(.ask-open) .pill.brand { display:flex; }
  .pill.brand:hover { box-shadow:0 4px 12px rgba(217,34,40,0.36); transform:translateY(-1px); }
  /*
   * Responsive collapse-then-fold is measured in map-actionbar.js, not keyed to a breakpoint —
   * it drops labels to circles and then folds circles into the overflow menu, matching
   * src/components/ActionBar.tsx. `.mi-folded` rows the script appends inherit `.menuitem`.
   */
  .seg { display:flex; align-items:center; justify-content:flex-end; padding:4px 24px 8px; flex:none; }
  .segwrap { display:inline-flex; background:var(--gray-100,#F2F0EF); border-radius:9999px; padding:4px; }
  .segbtn { border:none; background:transparent; color:#1A1816; font-family:inherit; font-size:14px; font-weight:600; height:32px; padding:0 16px; border-radius:9999px; cursor:pointer; transition:background 120ms, box-shadow 120ms; }
  .segbtn:not(.on):hover { background:rgba(0,0,0,0.04); }
  .segbtn.on { background:#FFFFFF; box-shadow:var(--shadow-raised, 0 1px 3px rgba(26,24,22,0.16)); }
  #content { flex:1; min-height:0; display:flex; flex-direction:column; }
  #content.horizontal { flex-direction:row; }
  #pane { display:flex; flex-direction:column; flex:none; }
  #content.horizontal #pane { width:52%; min-width:0; overflow:auto; border-right:1px solid #E9E7E4; }
  .tblwrap { overflow-x:auto; padding:0 24px; }
  table { border-collapse:collapse; width:100%; min-width:1080px; }
  th { text-align:left; font-size:12px; font-weight:800; padding:10px 10px; border-bottom:1px solid #E9E7E4; white-space:nowrap; }
  td { font-size:13px; font-weight:600; padding:14px 10px; border-bottom:1px solid #E9E7E4; white-space:nowrap; }
  td.dim, th.dim { color:#958A7F; }
  .notelink { color:#D92228; font-weight:700; text-decoration:none; cursor:pointer; }
  .notelink:hover { text-decoration:underline; }
  .statussel { display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
  .rowbtn { border:none; background:transparent; color:#1A1816; cursor:pointer; padding:2px; display:inline-flex; }
  .midrow { display:flex; align-items:center; gap:10px; padding:10px 24px 12px; flex:none; position:relative; }
  .midrow .links { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; }
  .midrow a { text-decoration:underline; text-underline-offset:3px; }
  .expander { position:absolute; left:50%; top:-16px; transform:translateX(-50%); width:36px; height:36px; border-radius:50%; border:1px solid #D3CFCA; background:#FFFFFF; color:#1A1816; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .commute { margin-left:auto; display:flex; align-items:center; gap:14px; }
  .commute .drive { display:flex; align-items:center; gap:8px; border:1px solid #D3CFCA; border-radius:40px; height:32px; padding:0 14px; font-size:12px; font-weight:700; background:#FFFFFF; }
  .commute .walk { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; }
  #mapwrap { flex:1; min-height:0; position:relative; }
  #map { position:absolute; inset:0; }
  .overlay { position:absolute; z-index:800; }
  .showroute { top:16px; left:16px; }
  .optimize { top:16px; right:16px; }
  .layersbtn { right:16px; bottom:24px; height:40px; border-radius:8px; border:1px solid #D3CFCA; background:#FFFFFF; color:#1A1816; font-family:inherit; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; padding:0 14px; cursor:pointer; box-shadow:0 1px 4px rgba(26,24,22,0.16); }
  .leaflet-tile-pane { filter:saturate(0.55) brightness(1.04) contrast(0.94); }
  .stop-pin { background:transparent; border:none; }
  .stop-pin .sq { display:flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:6px; background:#1A1816; color:#FFFFFF; font-family:var(--font-body,'Mulish',sans-serif); font-weight:800; font-size:12px; box-shadow:0 1px 4px rgba(26,24,22,0.4); border:2px solid #FFFFFF; transform:translate(-50%,-50%); }
  .leaflet-control-zoom { border:none !important; box-shadow:none !important; display:flex; flex-direction:column; gap:8px; margin-right:16px !important; margin-bottom:80px !important; }
  .leaflet-control-zoom a { width:36px !important; height:36px !important; line-height:34px !important; border-radius:50% !important; border:1px solid #D3CFCA !important; background:#FFFFFF !important; color:#1A1816 !important; font-weight:600; box-shadow:0 1px 4px rgba(26,24,22,0.16); }

  /*
   * Narrow viewports (the shell's own mobile breakpoint, since this page is only ever
   * framed by it). Header and commute rows wrap instead of squeezing, and the horizontal
   * split reverts to stacked — a 52% pane leaves neither the table nor the map usable
   * below ~700px. The table keeps its 1080px floor and goes on scrolling in `.tblwrap`.
   */
  @media (max-width:768px) {
    /* The title block takes the whole first row, so this gap only separates the two rows. */
    .hdr { flex-wrap:wrap; gap:8px; padding:12px 12px 0; }
    /* Clears the shell's floating subnav trigger, which overlays this corner. */
    .hdr > div:first-child { flex:1 1 100%; min-width:0; margin-left:56px; }
    .hdr h1 { font-size:18px; line-height:22px; }
    .hdr .date { margin-top:4px; font-size:13px; }
    /*
      Pills keep their 36px/13px size here. This block is keyed to the iframe's own width,
      and this frame is far narrower than the window — at a 1100px viewport it is ~588px
      while the Search frame is ~908px — so shrinking them would size the same Ask control
      differently on the two map pages at the same viewport. Only the padding gives way,
      and by then the labels have already dropped at 1200px anyway.
    */
    .hdr .pill { padding:0 12px; }
    .seg { padding:4px 12px 8px; }
    .tblwrap { padding:0 12px; }
    .midrow { flex-wrap:wrap; padding:10px 12px 12px; }
    .commute { margin-left:0; flex:1 1 100%; }
    #content.horizontal { flex-direction:column; }
    #content.horizontal #pane { width:auto; overflow:visible; border-right:none; }
  }
</style>
</head>
<body>
  <div class="hdr">
    <div style="flex:1;">
      <h1 id="tourClient"></h1>
      <div class="date" id="tourDate"></div>
    </div>
    <div class="actionbar">
      <!-- Far left of the action bar, and a real overflow menu — see the .menupanel rules. -->
      <div class="menuwrap" id="moreWrap">
        <button class="iconbtn" id="moreBtn" aria-label="More" aria-haspopup="menu" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
        </button>
        <div class="menupanel" role="menu">
          <button class="menuitem" role="menuitem">Share with client</button>
          <button class="menuitem" role="menuitem">Print tour sheet</button>
          <button class="menuitem" role="menuitem">Duplicate tour</button>
          <button class="menuitem" role="menuitem">Cancel tour</button>
        </div>
      </div>
      <button class="pill light" aria-label="Export" title="Export">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
        <span class="lbl">Export</span>
      </button>
      <button class="pill dark" aria-label="Add to calendar" title="Add to calendar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"></path></svg>
        <span class="lbl">Add to calendar</span>
      </button>
      <button class="pill brand" id="askBtn" aria-label="Ask RealAssist+ AI" title="Ask RealAssist+ AI">
        <!-- The RealAssist+ mark from src/icons.tsx (IconRealAssist), duplicated because a
             public/ page cannot import the app's modules. 20 units of artwork inset 2 units
             in a 24-unit box, so the glyph scales with the box instead of being clipped. -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:block;flex:none;"><g transform="translate(2, 2)"><path d="M 10.351 0 C 10.351 5.327 14.673 9.649 20 9.649 L 20 10.351 C 14.673 10.351 10.351 14.673 10.351 20 L 9.649 20 C 9.649 14.673 5.327 10.351 0 10.351 L 0 9.649 C 5.327 9.649 9.649 5.327 9.649 0 L 10.351 0 Z" fill-rule="evenodd"></path><path d="M 17.024 13.27 C 17.024 14.864 18.315 16.165 19.92 16.165 L 19.92 16.375 C 18.326 16.375 17.025 17.665 17.024 19.27 L 16.815 19.27 C 16.815 17.675 15.525 16.375 13.92 16.375 L 13.92 16.165 C 15.514 16.165 16.815 14.874 16.815 13.27 L 17.024 13.27 Z" fill-rule="evenodd"></path><path d="M 16.92 2.899 C 17.472 2.899 17.92 3.347 17.92 3.899 C 17.92 4.452 17.472 4.899 16.92 4.899 C 16.368 4.899 15.92 4.452 15.92 3.899 C 15.92 3.347 16.368 2.899 16.92 2.899 Z" fill-rule="evenodd"></path></g></svg>
        <span class="lbl">Ask RealAssist&trade;+ AI</span>
      </button>
    </div>
  </div>
  <div class="seg">
    <div class="segwrap">
    <button class="segbtn on" id="segV">Vertical</button>
    <button class="segbtn" id="segH">Horizontal</button>
    </div>
  </div>
  <div id="content">
    <div id="pane">
      <div class="tblwrap">
        <table>
          <thead>
            <tr><th>Move</th><th>Order</th><th>Status</th><th>D/S</th><th>Address</th><th>Broker tour</th><th>Open house</th><th>Time</th><th>Tour status</th><th>Notes</th><th>Showing instructions</th><th>Comments</th><th>Remove</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="midrow">
        <button class="expander" aria-label="Expand table">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6 4-4 4 4"></path><path d="m8 18 4 4 4-4"></path><path d="M4 12h16"></path></svg>
        </button>
        <div class="links"><a href="#" onclick="return false">Add listing</a><span style="color:#958A7F;">·</span><a href="#" onclick="return false">Add a stop</a></div>
        <div class="commute">
          <span class="drive">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg>
            <span id="driveTime"></span>
          </span>
          <span class="walk">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"></circle><path d="m13 7-2 5 3 3v6"></path><path d="m9 12-2 2 1 6"></path><path d="M14 10.5 17 12l2-1"></path></svg>
            <a href="#" onclick="return false" id="walkTime"></a>
          </span>
        </div>
      </div>
    </div>
    <div id="mapwrap">
      <div id="map"></div>
      <button class="overlay pill dark showroute">Show route</button>
      <button class="overlay pill light optimize">Optimize</button>
      <button class="overlay layersbtn">Layers
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5Z"></path><path d="m3 12 9 5 9-5"></path><path d="m3 17 9 5 9-5"></path></svg>
      </button>
    </div>
  </div>
<script>
  // Mirrors two roster tours in src/data/sample/sample-data.json.
  // This file is served from public/, so it cannot import the dataset; if the sample
  // data changes, these three rows have to be updated by hand.
  //
  // The dataset's cities are fictional and carry no coordinates. The lat/lngs below are
  // arbitrary map positions chosen only to give the route three separated pins.
  const TOURS = {
    priyanka: {
      client: 'Priyanka Raman',
      date: "Sun, Aug 9 '26",
      drive: null, walk: null,
      stops: [
        { order: 'A', status: 'Price Change', addr: '1442 92nd Court', city: 'Rivertown, ST', time: '2:30 PM', tourStatus: 'Requested', ll: [37.5410, -122.0490] }
      ]
    },
    castellanos: {
      client: 'Jordan & Mia Castellanos',
      date: "Sat, Aug 15 '26",
      drive: '36 min', walk: '13 hr 5 min',
      stops: [
        { order: 'A', status: 'Price Change', addr: '195 Stanton Way', city: 'Summit Grove, ST', time: '10:00 AM', tourStatus: 'Confirmed', ll: [37.5288, -122.0532] },
        { order: 'B', status: 'Price Change', addr: '1678 Wallace Ave', city: 'Old Quarter, ST',  time: null,      tourStatus: 'Requested', ll: [37.5568, -122.0478] },
        { order: 'C', status: 'New',          addr: '3975 Turnley Ct',  city: 'Cedar Vale, ST',   time: null,      tourStatus: 'No status', ll: [37.5462, -122.0421] }
      ]
    }
  };

  const dim = '<span style="color:#958A7F;">\u2014</span>';
  function rowHtml(s) {
    return '<tr>' +
      '<td><button class="rowbtn" aria-label="Move"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button></td>' +
      '<td>' + s.order + '</td>' +
      '<td>' + s.status + '</td>' +
      '<td>' + dim + '</td>' +
      '<td>' + s.addr + '</td>' +
      '<td>' + dim + '</td>' +
      '<td>' + dim + '</td>' +
      (s.time ? '<td>' + s.time + '</td>' : '<td class="dim">-- : -- &nbsp;--</td>') +
      '<td><span class="statussel">' + s.tourStatus + ' <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span></td>' +
      '<td><a class="notelink">Add note</a></td>' +
      '<td>' + dim + '</td>' +
      '<td>' + dim + '</td>' +
      '<td><button class="rowbtn" aria-label="Remove"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6M15 9l-6 6"></path></svg></button></td>' +
      '</tr>';
  }
  // One map, re-populated per tour. `tourLayer` holds the current tour's pins and route so a
  // switch can drop them cleanly; `routeToken` lets a switch ignore a late OSRM response for
  // the tour it replaced. renderTour() is a no-op when asked for the tour already showing.
  let map = null;
  let tourLayer = null;
  let routeToken = 0;
  let currentTour = null;
  function drawFallback(stops) {
    return L.polyline(stops.map(s => s.ll), { color: '#6B7F9E', weight: 5, opacity: 0.85, dashArray: '8 8' });
  }
  function renderTour(tour) {
    if (tour === currentTour) return;
    currentTour = tour;

    document.getElementById('tourClient').textContent = tour.client;
    document.getElementById('tourDate').textContent = tour.date;
    // A single-stop tour has no leg to drive or walk, so its commute row is hidden.
    const commute = document.querySelector('.commute');
    if (tour.stops.length > 1) {
      commute.style.display = '';
      document.getElementById('driveTime').textContent = tour.drive;
      document.getElementById('walkTime').textContent = tour.walk;
    } else {
      commute.style.display = 'none';
    }
    document.getElementById('rows').innerHTML = tour.stops.map(rowHtml).join('');

    if (!map) {
      map = L.map('map', { zoomControl: false });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
    }
    if (tourLayer) tourLayer.remove();
    tourLayer = L.featureGroup().addTo(map);
    tour.stops.forEach(s => {
      const icon = L.divIcon({ className: 'stop-pin', html: '<span class="sq">' + s.order + '</span>', iconSize: [0, 0] });
      L.marker(s.ll, { icon }).addTo(tourLayer).bindPopup('<b>' + s.addr + '</b><br>' + s.city);
    });
    const token = ++routeToken;
    if (tour.stops.length > 1) {
      map.fitBounds(L.latLngBounds(tour.stops.map(s => s.ll)).pad(0.35));
      // Real driving route via OSRM public routing (falls back to straight legs if unreachable).
      fetch('https://router.project-osrm.org/route/v1/driving/' + tour.stops.map(s => s.ll[1] + ',' + s.ll[0]).join(';') + '?overview=full&geometries=geojson')
        .then(r => r.json())
        .then(d => {
          if (token !== routeToken) return; // a newer tour took over while this was in flight
          if (d.routes && d.routes[0]) {
            L.geoJSON(d.routes[0].geometry, { style: { color: '#6B7F9E', weight: 6, opacity: 0.9 } }).addTo(tourLayer);
            map.fitBounds(tourLayer.getBounds().pad(0.2));
          } else drawFallback(tour.stops).addTo(tourLayer);
        })
        .catch(() => { if (token === routeToken) drawFallback(tour.stops).addTo(tourLayer); });
    } else {
      // One stop, so there is no route — centre on the pin rather than fit a zero-size box.
      map.setView(tour.stops[0].ll, 15);
    }
    // The frame may have been off-screen until now, so let Leaflet remeasure its container.
    setTimeout(() => map.invalidateSize(), 60);
  }

  document.getElementById('segV').addEventListener('click', () => setLayout(false));
  document.getElementById('segH').addEventListener('click', () => setLayout(true));
  function setLayout(horizontal) {
    document.getElementById('content').classList.toggle('horizontal', horizontal);
    document.getElementById('segV').classList.toggle('on', !horizontal);
    document.getElementById('segH').classList.toggle('on', horizontal);
    if (map) setTimeout(() => map.invalidateSize(), 240);
  }

  // Priyanka's already-created tour shows by default; the shell swaps in Jordan & Mia's once
  // the RealAssist+ flow books it (see the `ra:tour-visible` handler below).
  renderTour(TOURS.priyanka);

  // Overflow menu. Click-outside and Escape close it, matching src/components/Menu.tsx.
  const moreWrap = document.getElementById('moreWrap');
  const moreBtn = document.getElementById('moreBtn');
  function setMenu(open) {
    moreWrap.classList.toggle('open', open);
    moreBtn.setAttribute('aria-expanded', String(open));
  }
  moreBtn.addEventListener('click', e => {
    e.stopPropagation();
    setMenu(!moreWrap.classList.contains('open'));
  });
  moreWrap.querySelectorAll('.menuitem').forEach(it => it.addEventListener('click', () => setMenu(false)));
  document.addEventListener('mousedown', e => {
    if (!moreWrap.contains(e.target)) setMenu(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') setMenu(false);
  });

  // The shell tells this frame whether the assistant-coordinated tour (Jordan & Mia's) has
  // been booked — see TOUR_VISIBLE_MESSAGE in src/askBridge.ts. Booked, the map switches to
  // it; until then it stays on Priyanka's already-created tour. Posted on each frame load and
  // on change, so a frame that loaded before booking catches up once it happens.
  window.addEventListener('message', e => {
    if (e.origin !== location.origin) return;
    if (!e.data || e.data.type !== 'ra:tour-visible') return;
    renderTour(e.data.visible ? TOURS.castellanos : TOURS.priyanka);
  });

  // ── Action bar, variant B of the FAB-placement test ─────────────────────────────
  //
  // The shell appends `?ab=b` to this iframe's src, so the page knows which arm it is in
  // without needing to be told after load. Opening the assistant is the shell's job — the
  // panel lives out there, not in this document — so the click is forwarded up, and the
  // panel's open state comes back down so the button can hide while it is showing.
  if (new URLSearchParams(location.search).get('ab') === 'b') {
    document.body.classList.add('ab-b');
    document.getElementById('askBtn').addEventListener('click', () => {
      // Same-origin frame, so '*' is not a disclosure here; the shell checks the payload.
      parent.postMessage({ type: 'ra:ask' }, '*');
    });
    window.addEventListener('message', e => {
      if (e.origin !== location.origin) return;
      if (e.data && e.data.type === 'ra:ask-visible') {
        document.body.classList.toggle('ask-open', !e.data.visible);
      }
    });
  }
</script>
<!-- Measured collapse-then-fold for the action bar; shared with search-map.html. -->
<script src="map-actionbar.js"></script>
</body>
